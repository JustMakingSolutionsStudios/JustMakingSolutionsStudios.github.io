<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">

  <title>{%- if page.title -%} {{ page.title }} @ {% endif -%} {{ site.title }}</title>
  <!-- meta -->
  <meta charset="utf-8" />
  {%- if page.description -%}
    <meta name="description" content="{{ page.description }}">
  {%- endif -%}
  <meta name="author" content="JMStudios">
  <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
  {{ page.meta }}
  <!-- mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- styles -->
  <link rel="stylesheet" href="./assets/css/footer.css">
  <link rel="stylesheet" href="./assets/css/header.css">
  <link rel="stylesheet" href="./assets/css/logo.css">
  <link rel="stylesheet" href="./assets/css/colors.css">
  <link rel="stylesheet" href="./assets/css/page.css">
  <link rel="stylesheet" href="./assets/css/portfolio.css">
  <link rel="stylesheet" href="./assets/css/products.css">
  <link rel="stylesheet" href="./assets/css/services.css">
  <link rel="stylesheet" href="./assets/css/layout.css">  
  {{ page.styles }}
  <script src="https://kit.fontawesome.com/a5c8bf6536.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,400i,600,600i,700,700i&display=swap"
    rel="stylesheet">
  <!--   -->
  <!-- {{ page.scripts }} -->
</head>

<body>
  <div class="layout">
    {% include header.html %}
    <main class="page">
      <div class="pageContent">
        {{ content }}
      </div>
    </main>
    {% include footer.html %}
  </div>

</body>

</html>
